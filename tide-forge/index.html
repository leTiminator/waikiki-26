// ===================== TANK / RENDER =====================
let motes=[];for(let i=0;i<60;i++)motes.push({x:Math.random(),y:Math.random(),z:Math.random(),s:0.15+Math.random()*0.5});
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let tms=0,last=0,acc=0;
function resize(){const r=tank.getBoundingClientRect();tank.width=Math.round(r.width*DPR);tank.height=Math.round(r.height*DPR);}
window.addEventListener('resize',resize);
function drawTankBG(w,h){
  const d=cfg().depth;
  const g=tctx.createLinearGradient(0,0,0,h),top=gradeColor([26,74,96],Math.max(0,d-6)),bot=gradeColor([6,14,26],d+10);
  g.addColorStop(0,`rgb(${top[0]},${top[1]},${top[2]})`);g.addColorStop(1,`rgb(${bot[0]},${bot[1]},${bot[2]})`);
  tctx.fillStyle=g;tctx.fillRect(0,0,w,h);
  tctx.save();tctx.globalCompositeOperation='lighter';
  for(let i=0;i<4;i++){const sx=w*(0.15+0.22*i)+(reduceMotion?0:Math.sin(tms/3000+i)*10);const grd=tctx.createLinearGradient(sx,0,sx-40,h);grd.addColorStop(0,'rgba(120,200,220,0.09)');grd.addColorStop(1,'rgba(120,200,220,0)');tctx.fillStyle=grd;tctx.beginPath();tctx.moveTo(sx,0);tctx.lineTo(sx+26,0);tctx.lineTo(sx-60,h);tctx.lineTo(sx-100,h);tctx.closePath();tctx.fill();}
  tctx.restore();tctx.save();
  for(const m of motes){if(!reduceMotion){m.y+=0.00018*m.s*(1+m.z);if(m.y>1.02)m.y=-0.02;}const px=m.x*w,py=((m.y%1)+1)%1*h,r=0.5+m.z*1.6;tctx.fillStyle=`rgba(180,210,225,${0.05+m.z*0.13})`;tctx.beginPath();tctx.arc(px,py,r,0,7);tctx.fill();}
  tctx.restore();
}
function blit(fr,cx,cy,scale,alpha){const A=state.asset;tctx.imageSmoothingEnabled=false;tctx.save();tctx.globalAlpha=alpha==null?1:alpha;
  tctx.drawImage(fr,Math.round(cx-A.w*scale/2),Math.round(cy-A.h*scale/2),A.w*scale,A.h*scale);tctx.restore();}
function loop(ts){
  if(!last)last=ts;const dt=ts-last;last=ts;tms=ts;
  const w=tank.width,h=tank.height;drawTankBG(w,h);
  if(state.frames.length&&state.asset){
    const A=state.asset,M=mod(),fit=M.fit||1.5,F=state.frames.length;
    const scale=Math.max(2,Math.floor(Math.min(w/(A.w*fit),h/(A.h*fit*1.13))));
    if(state.playing&&!reduceMotion&&F>1){acc+=dt;const step=1000/clip().fps;while(acc>=step){acc-=step;state.frame=(state.frame+1)%F;}syncScrub();}
    const bobY=(M.float===false||reduceMotion)?0:Math.sin(ts/1400)*h*0.015;
    const cx=w*0.5,cy=h*0.5+bobY;
    if(state.onion&&!state.playing&&F>1){blit(state.frames[(state.frame-1+F)%F],cx,cy,scale,0.22);blit(state.frames[(state.frame+1)%F],cx,cy,scale,0.22);}
    blit(state.frames[state.frame%F],cx,cy,scale,1);
  }
  requestAnimationFrame(loop);
}

// ===================== BUILD PIPELINE =====================
function rebuildAsset(){state.asset=buildAsset(mod(),cfg(),clip());}
function rebuildCache(){const c=cfg();state.cache=buildColorCache(c.pal,c.depth,c.corrupt);}
function rebakeClip(){
  if(mod().baked)rebuildAsset();                        // baked modules regenerate per clip
  state.frames=bakeFrames(state.asset,state.cache,clip());
  if(state.frame>=state.frames.length)state.frame=0;
  buildStrip();syncScrub();drawRamp();
}
function fullRebuild(){rebuildAsset();rebuildCache();rebakeClip();updateHud();updateInfo();}
function updateHud(){
  const c=cfg(),extra=(mod().hud?mod().hud(c):[]).filter(Boolean);
  document.getElementById('hud').innerHTML=
    `<div class="chip">SEED <b>${c.seed>>>0}</b></div>`+extra.map(e=>`<div class="chip">${e}</div>`).join('')+
    `<div class="chip">DEPTH <b>${c.depth}m</b></div>`+
    (c.corrupt>0.01?`<div class="chip warn">CORRUPT <b>${Math.round(c.corrupt*100)}%</b></div>`:'');
}
function updateInfo(){const c=cfg(),cl=clip(),M=mod();
  const anim=M.static?`${state.asset?state.asset.w+'×'+state.asset.h:''} static`:`${cl.name} clip · ${cl.frames}f @ ${cl.fps}fps`;
  document.getElementById('specInfo').textContent=`${M.label2?M.label2(c):M.label} · ${anim} · ${PALETTES[c.pal].name}`;}
function drawRamp(){const el=document.getElementById('ramp');el.innerHTML='';
  const cache=state.cache,order=[OUTLINE,BACK,SHADOW,BASE,HIGH,SPEC,BELLY,FIN,PATTERN,EYEW];
  for(const r of order){const c=cache[r];const i=document.createElement('i');i.style.background=`rgb(${c[0]},${c[1]},${c[2]})`;el.appendChild(i);}}

// ===================== TIMELINE UI =====================
function buildStrip(){
  const el=document.getElementById('strip');el.innerHTML='';
  const A=state.asset;if(!A)return;
  state.frames.forEach((fr,i)=>{
    const d=document.createElement('div');d.className='fr';d.setAttribute('aria-pressed',i===state.frame);
    const cv=document.createElement('canvas');cv.width=A.w;cv.height=A.h;
    const tw=Math.round(58*Math.min(1.6,A.w/A.h));cv.style.width=tw+'px';cv.style.height=Math.round(tw*A.h/A.w)+'px';
    cv.getContext('2d').drawImage(fr,0,0);
    d.appendChild(cv);const n=document.createElement('span');n.className='n';n.textContent=i+1;d.appendChild(n);
    d.onclick=()=>{state.playing=false;setPlayIcon();state.frame=i;syncScrub();markStrip();};
    el.appendChild(d);
  });
}
function markStrip(){[...document.getElementById('strip').children].forEach((c,i)=>c.setAttribute('aria-pressed',i===state.frame));}
function syncScrub(){const s=document.getElementById('scrub');s.max=Math.max(0,state.frames.length-1);s.value=state.frame;
  document.getElementById('tcount').textContent=`frame ${state.frame+1} / ${state.frames.length}`;markStrip();}
function buildClips(){
  const el=document.getElementById('clips');el.innerHTML='<span class="lbl">Clips</span>';
  const cs=clips(),idx=state.clipIdxs[state.modId];
  cs.forEach((cl,i)=>{const b=document.createElement('button');b.className='clip';b.setAttribute('aria-pressed',i===idx);
    b.innerHTML=`${cl.name}`+(cs.length>1?` <span class="x" title="delete">✕</span>`:'');
    b.onclick=e=>{
      if(e.target.classList.contains('x')){cs.splice(i,1);if(state.clipIdxs[state.modId]>=cs.length)state.clipIdxs[state.modId]=cs.length-1;}
      else state.clipIdxs[state.modId]=i;
      buildClips();buildRail();rebakeClip();updateInfo();};
    el.appendChild(b);});
  const add=document.createElement('button');add.className='add';add.textContent='+ clip';
  add.onclick=()=>{const base=clip(),names=['idle','dart','hurt','feed','drift','calm','churn','storm'];
    const nm=names.find(n=>!cs.some(c=>c.name===n))||('clip'+(cs.length+1));
    cs.push(Object.assign({},base,{name:nm}));state.clipIdxs[state.modId]=cs.length-1;
    buildClips();buildRail();rebakeClip();updateInfo();toast('added clip “'+nm+'”');};
  el.appendChild(add);
}

// ===================== RAIL (generated from paramSchema) =====================
let dirtyAsset=false,dirtyColor=false,dirtyClip=false;
function markAsset(){dirtyAsset=true;}function markColor(){dirtyColor=true;}function markClip(){dirtyClip=true;}
function tick(){
  if(dirtyAsset){dirtyAsset=false;rebuildAsset();rebakeClip();updateHud();updateInfo();}
  else if(dirtyColor){dirtyColor=false;rebuildCache();rebakeClip();updateHud();updateInfo();}
  else if(dirtyClip){dirtyClip=false;rebakeClip();updateInfo();}
  requestAnimationFrame(tick);
}
const foldOpen={palette:false};

function elm(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function panelGroup(title,hcls){
  const p=elm('div','panel group');const h=elm('h3',hcls||'',title);p.appendChild(h);return p;
}
function fieldChips(parent,label,options,get,set,fmt){
  const f=elm('div','field');f.appendChild(elm('div','lab',`<span>${label}</span>`));
  const row=elm('div','chips');
  options.forEach(o=>{const b=elm('button',null,fmt?fmt(o):o);b.dataset.v=o;b.setAttribute('aria-pressed',get()===o);
    b.onclick=()=>{set(o);[...row.children].forEach(c=>c.setAttribute('aria-pressed',c.dataset.v===String(o)));};row.appendChild(b);});
  f.appendChild(row);parent.appendChild(f);
}
function fieldRange(parent,label,min,max,step,get,set,fmt,tone){
  const f=elm('div','field'),val=elm('span','val'+(tone?' '+tone:''),fmt(get()));
  const lab=elm('div','lab',`<span>${label}</span>`);lab.appendChild(val);f.appendChild(lab);
  const inp=elm('input');inp.type='range';inp.min=min;inp.max=max;inp.step=step;inp.value=get();if(tone)inp.className=tone;
  inp.addEventListener('input',e=>{const v=+e.target.value;set(v);val.textContent=fmt(v);});
  f.appendChild(inp);parent.appendChild(f);
}
function fieldToggle(parent,label,get,set){
  const f=elm('div','field'),l=elm('label','toggle');const i=elm('input');i.type='checkbox';i.checked=!!get();
  i.addEventListener('change',e=>set(e.target.checked));
  l.appendChild(i);l.appendChild(document.createTextNode(' '+label));f.appendChild(l);parent.appendChild(f);
}

function buildRail(){
  const rail=document.getElementById('rail');rail.innerHTML='';
  const M=mod(),c=cfg();

  // --- module params, grouped exactly as the module declares ---
  (M.groups||[{key:'main',title:M.label}]).forEach(g=>{
    const items=M.paramSchema.filter(p=>(p.group||'main')===g.key);
    if(!items.length)return;
    const p=panelGroup(g.title);
    items.forEach(s=>{
      if(s.type==='chips')fieldChips(p,s.label,s.options,()=>c[s.key],v=>{c[s.key]=v;markAsset();});
      else if(s.type==='range')fieldRange(p,s.label,s.min,s.max,s.step,()=>c[s.key],v=>{c[s.key]=v;markAsset();},s.fmt||(v=>v));
      else if(s.type==='toggle')fieldToggle(p,s.label,()=>c[s.key],v=>{c[s.key]=v;markAsset();});
    });
    rail.appendChild(p);
  });

  // --- palette (shared by every module) ---
  const pg=panelGroup('Palette');
  const sw=elm('div','swatches');
  const paintSwatches=()=>{sw.innerHTML='';PALETTES.forEach((p,i)=>{const b=elm('button');b.title=p.name;
    b.style.background=`linear-gradient(135deg,${p.ramp[1]},${p.ramp[3]})`;b.setAttribute('aria-pressed',c.pal===i);
    b.onclick=()=>{c.pal=i;[...sw.children].forEach((q,j)=>q.setAttribute('aria-pressed',j===i));paintEditor();markColor();};sw.appendChild(b);});};
  const f=elm('div','field');f.appendChild(elm('div','lab','<span>Master ramp</span>'));f.appendChild(sw);pg.appendChild(f);
  rail.appendChild(pg);

  // --- animation (shared; a static module has no timeline) ---
  document.getElementById('transport').classList.toggle('hidden',!!M.static);
  document.getElementById('strip').classList.toggle('hidden',!!M.static);
  document.getElementById('clips').classList.toggle('hidden',!!M.static);
  if(!M.static){
    const cl=clip(),ag=panelGroup(`Animation · <span>${cl.name}</span>`,'animh');
    if(M.motions.length>1)fieldChips(ag,'Motion model',M.motions,()=>cl.motion,v=>{cl.motion=v;markClip();},v=>MOTION_LABEL[v]||v);
    fieldRange(ag,'Amplitude',0,6,0.1,()=>cl.amp,v=>{cl.amp=v;markClip();},v=>v.toFixed(1),'amber');
    fieldRange(ag,M.baked?'Emitter speed':'Wave speed',0.05,0.9,0.01,()=>cl.freq,v=>{cl.freq=v;markClip();},v=>v.toFixed(2),'amber');
    fieldRange(ag,'Current · bias',-2,2,0.1,()=>cl.bias||0,v=>{cl.bias=v;markClip();},v=>v.toFixed(1),'amber');
    fieldRange(ag,'Frames',2,24,1,()=>cl.frames,v=>{cl.frames=v|0;markClip();},v=>v|0,'amber');
    fieldRange(ag,'Playback FPS',2,24,1,()=>cl.fps,v=>{cl.fps=v|0;updateInfo();},v=>v|0,'amber');
    if(M.hint)ag.appendChild(elm('p','hint',M.hint));
    rail.appendChild(ag);
  } else if(M.hint){const hg=panelGroup('Autotiling');hg.appendChild(elm('p','hint',M.hint));rail.appendChild(hg);}

  // --- dive conditions + corruption (shared) ---
  const dg=panelGroup('Dive conditions');
  fieldRange(dg,'Depth · light absorption',0,60,1,()=>c.depth,v=>{c.depth=v;markColor();},v=>(v|0)+' m');
  rail.appendChild(dg);
  const wg=panelGroup('The wrongness','warnh');
  fieldRange(wg,'Corruption',0,1,0.01,()=>c.corrupt,v=>{c.corrupt=v;M.corruptShape?markAsset():markColor();},v=>Math.round(v*100)+'%','warn');
  rail.appendChild(wg);

  // --- asset library ---
  const lg=panelGroup('Asset library');
  const grid=elm('div','lib');lg.appendChild(grid);
  const mb=elm('div','minibtns');
  const bAdd=elm('button',null,'Save current');bAdd.onclick=()=>libAdd();
  const bClr=elm('button',null,'Clear all');bClr.onclick=()=>{if(libRead().length&&confirm('Delete every saved asset?')){libWrite([]);paintLib();toast('library cleared');}};
  mb.appendChild(bAdd);mb.appendChild(bClr);lg.appendChild(mb);
  lg.appendChild(elm('p','hint','A seed + cfg reproduces an asset exactly, so entries are tiny. Saved in this browser.'));
  rail.appendChild(lg);
  const paintLib=()=>{
    const items=libRead();grid.innerHTML='';
    if(!items.length){grid.style.display='block';grid.appendChild(elm('div','libempty','No saved assets yet.<br>Hit <b>Save current</b> or the Save button up top.'));return;}
    grid.style.display='grid';
    items.forEach(en=>{
      const b=elm('button','slot');b.title=`${en.module} · ${en.name}`;
      try{b.appendChild(thumbOf(en,48));}catch(err){b.appendChild(elm('div',null,'?'));}
      b.appendChild(elm('span','tag',en.name));
      const k=elm('button','kill','✕');k.title='delete';
      k.onclick=ev=>{ev.stopPropagation();libWrite(libRead().filter(q=>q.id!==en.id));paintLib();toast('removed');};
      b.appendChild(k);
      b.onclick=()=>libLoadEntry(en);
      grid.appendChild(b);});
  };
  railPaintLib=paintLib;paintLib();

  // --- palette editor (lite) ---
  const eg=elm('details','panel group fold');if(foldOpen.palette)eg.open=true;
  eg.addEventListener('toggle',()=>{foldOpen.palette=eg.open;});
  const sum=elm('summary');sum.appendChild(elm('h3',null,'Palette editor<span class="caret">▶</span>'));
  eg.appendChild(sum);
  const body=elm('div','body');eg.appendChild(body);
  const stopsRow=elm('div','palrow'),stops=elm('div','stops');stopsRow.appendChild(stops);body.appendChild(stopsRow);
  const nameIn=elm('input','palname');nameIn.type='text';nameIn.maxLength=14;body.appendChild(nameIn);
  const pb=elm('div','minibtns');
  const bDup=elm('button',null,'+ Ramp');bDup.onclick=()=>{
    const src=PALETTES[c.pal];PALETTES.push({name:(src.name+'-2').slice(0,14),ramp:src.ramp.slice(),custom:true});
    c.pal=PALETTES.length-1;palPersist();paintSwatches();paintEditor();markColor();toast('added custom ramp');};
  const bRst=elm('button',null,'Reset');bRst.onclick=()=>{
    const b=BASE_PALETTES[c.pal];if(!b){toast('custom ramp — nothing to reset to');return;}
    PALETTES[c.pal]={name:b.name,ramp:b.ramp.slice()};palPersist();paintSwatches();paintEditor();markColor();};
  const bDel=elm('button',null,'Delete');bDel.onclick=()=>{
    if(c.pal<BASE_PALETTES.length){toast('master ramps can’t be deleted');return;}
    PALETTES.splice(c.pal,1);Object.values(state.cfgs).forEach(q=>{if(q.pal>=PALETTES.length)q.pal=PALETTES.length-1;});
    palPersist();paintSwatches();paintEditor();markColor();toast('ramp deleted');};
  pb.appendChild(bDup);pb.appendChild(bRst);pb.appendChild(bDel);body.appendChild(pb);
  body.appendChild(elm('p','hint','Roles map onto ramp steps, so every asset in every module recolors the moment you move a stop.'));
  function paintEditor(){
    const p=PALETTES[c.pal];nameIn.value=p.name;stops.innerHTML='';
    p.ramp.forEach((hex,i)=>{const inp=elm('input');inp.type='color';inp.value=hex;inp.title='step '+(i+1);
      inp.addEventListener('input',e=>{p.ramp[i]=e.target.value;palPersist();paintSwatches();markColor();});
      stops.appendChild(inp);});
  }
  nameIn.addEventListener('input',e=>{PALETTES[c.pal].name=e.target.value.slice(0,14)||'ramp';palPersist();paintSwatches();updateInfo();});
  paintSwatches();paintEditor();
  rail.appendChild(eg);

  rail.appendChild(elm('div','note','<b>Export.</b> PNG = current frame · '+
    (M.exportKind==='tiles'?'Sheet = the full 47-tile blob set · JSON = tile size, layout and the 256-entry bitmask→tile map':
     'Sheet = one row per clip (spritesheet) · JSON = manifest with clip names, frames, fps &amp; anchors')+', ready for a game engine.'));

  document.getElementById('bSheet').textContent=M.exportKind==='tiles'?'Tilesheet':'Sheet';
}
let railPaintLib=()=>{};

// ===================== ASSET LIBRARY =====================
const LIB_KEY='tideforge.library.v1',PAL_KEY='tideforge.palettes.v1',LIB_MAX=24;
function libRead(){try{const a=JSON.parse(localStorage.getItem(LIB_KEY));return Array.isArray(a)?a:[];}catch(e){return[];}}
function libWrite(a){try{localStorage.setItem(LIB_KEY,JSON.stringify(a));}catch(e){toast('browser storage is full');}}
function libAdd(){
  const M=mod(),c=cfg();
  const en={id:'a'+Date.now().toString(36)+Math.floor(Math.random()*999).toString(36),
    module:state.modId,name:(M.label2?M.label2(c):M.label)+' '+((c.seed>>>0)%10000),
    cfg:JSON.parse(JSON.stringify(c)),clips:JSON.parse(JSON.stringify(clips())),ts:Date.now()};
  const a=libRead();a.unshift(en);libWrite(a.slice(0,LIB_MAX));railPaintLib();toast('saved “'+en.name+'”');
}
function libLoadEntry(en){
  const M=modById(en.module);state.modId=M.id;
  state.cfgs[M.id]=Object.assign(M.defaults(),en.cfg);
  state.clipsets[M.id]=JSON.parse(JSON.stringify(en.clips));
  state.clipIdxs[M.id]=0;state.frame=0;
  syncModuleButtons();buildRail();buildClips();fullRebuild();toast('loaded “'+en.name+'”');
}
function palPersist(){try{localStorage.setItem(PAL_KEY,JSON.stringify(PALETTES));}catch(e){}}
function palRestore(){
  try{const a=JSON.parse(localStorage.getItem(PAL_KEY));
    if(Array.isArray(a)&&a.length>=BASE_PALETTES.length&&a.every(p=>p&&Array.isArray(p.ramp)&&p.ramp.length===5))
      PALETTES=a.map(p=>({name:String(p.name||'ramp'),ramp:p.ramp.slice(),custom:!!p.custom}));
  }catch(e){}
}

// Randomize is driven by the same paramSchema as the rail, so a new module gets it free.
document.getElementById('bRandom').onclick=()=>{
  const M=mod(),c=cfg(),R=Math.random;
  M.paramSchema.forEach(s=>{
    if(s.type==='chips')c[s.key]=s.options[(R()*s.options.length)|0];
    else if(s.type==='range'){const n=Math.round((s.min+R()*(s.max-s.min))/s.step)*s.step;c[s.key]=Math.round(n*1000)/1000;}
    else if(s.type==='toggle')c[s.key]=R()<0.35;
  });
  c.pal=(R()*PALETTES.length)|0;c.seed=(R()*1e9)|0;

function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;a.click();}
function stamp(){const c=cfg(),M=mod();return `tf_${M.id}_${(M.label2?M.label2(c):M.label).replace(/[^a-z0-9]+/gi,'-')}_${c.seed>>>0}`;}
function framesForClip(cl){const M=mod();const asset=M.baked?buildAsset(M,cfg(),cl):state.asset;return{asset,frames:bakeFrames(asset,state.cache,cl)};}

document.getElementById('bPng').onclick=()=>{
  const A=state.asset,S=8,cv=document.createElement('canvas');cv.width=A.w*S;cv.height=A.h*S;
  const x=cv.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(state.frames[state.frame],0,0,A.w*S,A.h*S);

document.getElementById('bSheet').onclick=()=>{

    set.forEach((row,v)=>row.forEach((tile,i)=>{
      const fr=matToCanvas(tile,TS,TS,state.cache);x.drawImage(fr,i*TS*S,v*TS*S,TS*S,TS*S);}));
    download(cv.toDataURL('image/png'),`${stamp()}_tilesheet.png`);
    toast(`exported ${cols}-tile blob set × ${V} variant${V>1?'s':''}`);return;
  }

document.getElementById('bJson').onclick=()=>{
  const M=mod(),c=cfg(),A=state.asset;let manifest;
  if(M.exportKind==='tiles'){

    manifest={engine:'TideForge',version:'M1',module:'tiles',source:{cfg:{...c}},

      bits:{n:NB_N,ne:NB_NE,e:NB_E,se:NB_SE,s:NB_S,sw:NB_SW,w:NB_W,nw:NB_NW},
      tiles:BLOB_KEYS.map((k,i)=>({index:i,key:k,col:i,
        neighbors:{n:!!(k&NB_N),ne:!!(k&NB_NE),e:!!(k&NB_E),se:!!(k&NB_SE),s:!!(k&NB_S),sw:!!(k&NB_SW),w:!!(k&NB_W),nw:!!(k&NB_NW)}})),
      maskToTile:Array.from(MASK_TO_KEY,k=>KEY_TO_INDEX[k]),
      note:'OR the bits of every solid neighbour into `mask` (0-255); maskToTile[mask] is the tile COLUMN. Diagonals only count when both of their cardinals are solid. Each sheet ROW is an interchangeable fill variant — pick one per cell to break up the repeat.'};
  }else{
    const cs=clips();
    manifest={engine:'TideForge',version:'M1',module:M.id,source:{cfg:{...c}},
      frameSize:{w:A.w,h:A.h},sheet:{scale:5,cols:Math.max(...cs.map(q=>q.frames)),rows:cs.length},
      anchors:A.meta.anchors||{},
      clips:cs.map((q,i)=>({name:q.name,row:i,frames:q.frames,fps:q.fps,motion:q.motion,
        amp:q.amp,freq:q.freq,bias:q.bias||0,loop:true}))};
    if(A.meta.emitter)manifest.emitter=A.meta.emitter;
  }
  download('data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(manifest,null,2)),`${stamp()}.json`);
  toast('exported JSON manifest');
};

let toastT;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800);}

// ===================== BOOT =====================
palRestore();
resize();buildRail();buildClips();fullRebuild();setPlayIcon();
requestAnimationFrame(loop);requestAnimationFrame(tick);
})();
</script>

<title>TideForge — procedural art & animation engine</title>
<style>
  :root{
    --abyss:#070b11; --panel:#0d141d; --panel2:#111b26; --line:#1d2a38; --line2:#26384a;
    --ink:#d3e3ef; --dim:#7f97aa; --faint:#3a4a5a;
    --accent:#31e0c6; --accent-ink:#062b26;
    --warn:#ff6f8b; --good:#63e08a; --amber:#ffb454;
    --shadow:0 12px 40px -14px rgba(0,0,0,.7);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:radial-gradient(130% 90% at 50% -10%,#0c1826 0%,var(--abyss) 62%);
    color:var(--ink);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
  .app{max-width:1300px;margin:0 auto;padding:18px clamp(12px,2.5vw,26px) 60px;display:flex;flex-direction:column;gap:16px}

  .topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:11px;font-family:var(--mono)}
  .brand b{font-weight:600;letter-spacing:.2em;font-size:15px}
  .brand .tag{font-style:normal;color:var(--dim);font-size:11px}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px 1px var(--accent);align-self:center;animation:pulse 3.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  .spacer{flex:1}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;flex-wrap:wrap}
  .seg button{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);background:none;border:0;padding:7px 12px;border-radius:6px;cursor:pointer;position:relative}
  .seg button[aria-pressed=true]{background:var(--panel2);color:var(--accent);box-shadow:inset 0 0 0 1px var(--line)}
  .seg button[disabled]{cursor:not-allowed;opacity:.5}
  .seg button .soon{font-size:8px;letter-spacing:.1em;color:var(--amber);position:absolute;top:-2px;right:2px}
  .acts{display:flex;gap:7px;flex-wrap:wrap}
  button.btn{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:8px 12px;border-radius:8px;cursor:pointer;transition:.15s}
  button.btn:hover{border-color:var(--accent);color:var(--accent)}
  button.btn.solid{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  button.btn.solid:hover{filter:brightness(1.08)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .stage{display:grid;grid-template-columns:1fr 322px;gap:16px;align-items:start}
  @media(max-width:920px){.stage{grid-template-columns:1fr}}
  .col{display:flex;flex-direction:column;gap:16px}
  .panel{background:linear-gradient(180deg,var(--panel) 0%,#0b121a 100%);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}

  .tankwrap{position:relative;overflow:hidden;border-radius:14px 14px 0 0}
  #tank{display:block;width:100%;height:clamp(300px,44vh,470px);background:#04070c}
  .hud{position:absolute;left:13px;top:11px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
  .chip{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--ink);background:rgba(8,14,20,.62);border:1px solid var(--line);border-radius:6px;padding:3px 7px;backdrop-filter:blur(3px)}
  .chip b{color:var(--accent);font-weight:600}
  .chip.warn b{color:var(--warn)}

  /* transport + timeline */
  .transport{display:flex;align-items:center;gap:12px;padding:9px 14px;border-top:1px solid var(--line)}
  .play{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--accent);cursor:pointer;font-size:14px;display:grid;place-items:center;flex:none}
  .play:hover{border-color:var(--accent)}
  .scrub{flex:1}
  .tcount{font-family:var(--mono);font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
  .onion{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--dim);cursor:pointer;user-select:none}
  .onion input{accent-color:var(--accent)}

  .strip{display:flex;gap:6px;overflow-x:auto;padding:11px 14px;border-top:1px solid var(--line);scrollbar-width:thin}
  .strip .fr{flex:none;border:1px solid var(--line);border-radius:6px;background:#05090f;padding:2px;cursor:pointer;position:relative;transition:.12s}
  .strip .fr[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .strip .fr canvas{display:block;image-rendering:pixelated;border-radius:3px}
  .strip .fr .n{position:absolute;bottom:1px;right:3px;font-family:var(--mono);font-size:8px;color:var(--dim)}

  .clips{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:11px 14px;border-top:1px solid var(--line)}
  .clips .clip{font-family:var(--mono);font-size:11px;color:var(--dim);background:var(--panel2);border:1px solid var(--line);padding:5px 10px;border-radius:16px;cursor:pointer;display:flex;align-items:center;gap:6px}
  .clips .clip[aria-pressed=true]{color:var(--accent);border-color:var(--accent);background:rgba(49,224,198,.08)}
  .clips .clip .x{color:var(--dim);font-size:12px;line-height:1}
  .clips .clip .x:hover{color:var(--warn)}
  .clips .add{font-family:var(--mono);font-size:12px;color:var(--dim);background:none;border:1px dashed var(--line2);padding:5px 11px;border-radius:16px;cursor:pointer}
  .clips .add:hover{color:var(--accent);border-color:var(--accent)}
  .clips .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-right:2px}

  .ramp{display:flex;height:22px;border-top:1px solid var(--line)}
  .ramp i{flex:1;display:block}

  .rail{display:flex;flex-direction:column;gap:14px}
  .group{padding:14px 15px 15px}
  .group h3{margin:0 0 12px;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px}
  .group h3::before{content:"";width:5px;height:5px;border-radius:1px;background:var(--accent);box-shadow:0 0 7px var(--accent)}
  .group h3.warnh::before{background:var(--warn);box-shadow:0 0 7px var(--warn)}
  .group h3.animh::before{background:var(--amber);box-shadow:0 0 7px var(--amber)}
  .field{margin-bottom:12px}.field:last-child{margin-bottom:0}
  .field .lab{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;margin-bottom:6px}
  .field .lab .val{font-family:var(--mono);font-size:11px;color:var(--accent);font-variant-numeric:tabular-nums}
  .field .lab .val.warn{color:var(--warn)} .field .lab .val.amber{color:var(--amber)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:3px;background:var(--line);outline:none;margin:5px 0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--ink);border:2px solid var(--accent);cursor:pointer;box-shadow:0 0 8px -1px var(--accent)}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--ink);border:2px solid var(--accent);cursor:pointer}
  input[type=range].warn::-webkit-slider-thumb{border-color:var(--warn);box-shadow:0 0 8px -1px var(--warn)}
  input[type=range].amber::-webkit-slider-thumb{border-color:var(--amber);box-shadow:0 0 8px -1px var(--amber)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips button{font-size:12px;color:var(--dim);background:var(--panel2);border:1px solid var(--line);padding:6px 11px;border-radius:20px;cursor:pointer;transition:.14s}
  .chips button:hover{color:var(--ink);border-color:var(--dim)}
  .chips button[aria-pressed=true]{color:var(--accent);border-color:var(--accent);background:rgba(49,224,198,.08)}
  .swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
  .swatches button{aspect-ratio:1;border-radius:6px;border:2px solid transparent;cursor:pointer;padding:0}
  .swatches button[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 1px var(--accent)}
  .hint{font-size:11px;color:var(--dim);line-height:1.5;margin:2px 0 0}
  .note{font-size:11px;color:var(--dim);line-height:1.5;background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:8px;padding:10px 12px}
  .note b{color:var(--ink);font-weight:600}
  .subbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;font-family:var(--mono);font-size:10px;color:var(--dim)}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--line2);color:var(--ink);font-family:var(--mono);font-size:12px;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--shadow);z-index:20}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---- M1 additions ---- */
  .hidden{display:none !important}
  .seg button .ico{margin-right:5px;font-size:11px}
  .field .lab .sub{font-family:var(--mono);font-size:10px;color:var(--faint)}
  .toggle{display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer;user-select:none}
  .toggle input{accent-color:var(--accent);width:15px;height:15px}

  /* asset library */
  .lib{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .lib .slot{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:8px;background:#05090f;overflow:hidden;cursor:pointer;padding:0;transition:.14s}
  .lib .slot:hover{border-color:var(--accent)}
  .lib .slot canvas{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;display:block}
  .lib .slot .kill{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:4px;border:0;background:rgba(6,10,16,.78);color:var(--dim);font-size:10px;line-height:1;cursor:pointer;display:none;padding:0}
  .lib .slot:hover .kill{display:block}
  .lib .slot .kill:hover{color:var(--warn)}
  .lib .slot .tag{position:absolute;left:0;right:0;bottom:0;font-family:var(--mono);font-size:8px;letter-spacing:.04em;color:var(--dim);background:rgba(6,10,16,.72);padding:2px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .libempty{font-size:11px;color:var(--faint);line-height:1.5;text-align:center;padding:14px 4px;border:1px dashed var(--line);border-radius:8px}

  /* palette editor */
  .palrow{display:flex;align-items:center;gap:7px;margin-top:9px}
  .palrow .stops{display:flex;flex:1;gap:4px}
  .palrow .stops input[type=color]{-webkit-appearance:none;appearance:none;flex:1;height:26px;padding:0;border:1px solid var(--line);border-radius:5px;background:none;cursor:pointer}
  .palrow .stops input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
  .palrow .stops input[type=color]::-webkit-color-swatch{border:0;border-radius:3px}
  .palname{font-family:var(--mono);font-size:11px;color:var(--accent);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:100%;margin-top:9px}
  .minibtns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .minibtns button{flex:1;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);background:var(--panel2);border:1px solid var(--line);padding:7px 6px;border-radius:7px;cursor:pointer;white-space:nowrap}
  .minibtns button:hover{color:var(--accent);border-color:var(--accent)}

  /* collapsible group */
  .group.fold h3{cursor:pointer;margin-bottom:0}
  .group.fold h3 .caret{margin-left:auto;color:var(--faint);font-size:9px;transition:.18s}
  .group.fold[open] h3{margin-bottom:12px}
  .group.fold[open] h3 .caret{transform:rotate(90deg)}
  .group.fold .body{display:none}
  .group.fold[open] .body{display:block}
</style>

<div class="app">
  <header class="topbar">
    <div class="brand"><span class="dot"></span><b>TIDEFORGE</b><span class="tag">procedural art &amp; animation engine</span></div>
    <div class="spacer"></div>
    <div class="seg" id="modules" role="group" aria-label="Module"></div>
    <div class="acts">
      <button class="btn" id="bRandom">Randomize</button>
      <button class="btn" id="bSeed">Seed</button>
      <button class="btn" id="bSave">Save</button>
      <button class="btn solid" id="bPng">PNG</button>
      <button class="btn" id="bSheet">Sheet</button>
      <button class="btn" id="bJson">JSON</button>
    </div>
  </header>

  <div class="stage">
    <div class="col">
      <section class="panel">
        <div class="tankwrap">
          <canvas id="tank" aria-label="Asset preview"></canvas>
          <div class="hud" id="hud"></div>
        </div>
        <div class="transport" id="transport">
          <button class="play" id="play" aria-label="Play / pause">&#9654;</button>
          <input type="range" class="scrub" id="scrub" min="0" max="11" value="0" aria-label="Scrub frame">
          <span class="tcount" id="tcount">frame 1 / 12</span>
          <label class="onion"><input type="checkbox" id="onion"> onion</label>
        </div>
        <div class="strip" id="strip"></div>
        <div class="clips" id="clips"></div>
        <div class="ramp" id="ramp" aria-hidden="true"></div>
        <div class="subbar"><span id="specInfo">ready</span><span>TideForge &middot; M1</span></div>
      </section>
    </div>

    <aside class="rail" id="rail"></aside>
  </div>
</div>
<div id="toast"></div>

<script>
"use strict";
(function(){
// ===================== CORE =====================
// Role ids. A generated asset is a matrix of ROLES, never colors — one matrix
// recolors into any palette / depth / corruption state. Shared by every module.
const EMPTY=0,OUTLINE=1,SPEC=2,BACK=3,SHADOW=4,BASE=5,HIGH=6,BELLY=7,FIN=8,FINEDGE=9,
      PATTERN=10,EYEW=11,EYEP=12,EYEH=13,GLOW=14,MOUTH=15,HAZE=16,HAZE2=17,GLOWDIM=18,
      RIM=19,TRANS=20,
      // Nine first-class shade steps. Five authored stops is too coarse a vocabulary to
      // model a rounded surface; generators quantise form onto these instead, and the
      // semantic roles below stay as aliases onto the same colours.
      S0=21,S1=22,S2=23,S3=24,S4=25,S5=26,S6=27,S7=28,S8=29,AA=30;
const SHADES=[S0,S1,S2,S3,S4,S5,S6,S7,S8];

const BASE_PALETTES=[
  {name:'coral',ramp:['#3a1410','#7a2d15','#c25a25','#e8873c','#f6c169']},
  {name:'tang',ramp:['#0d1f47','#1c3b8a','#2f6fd0','#4fa3e6','#a9dcff']},
  {name:'sunfish',ramp:['#4a3406','#8a6410','#d29a1c','#f0c53e','#ffe89a']},
  {name:'kelp',ramp:['#06302b','#0e5a4a','#1c8f76','#33bfa0','#9fe9d6']},
  {name:'violet',ramp:['#241043','#47207f','#7a3fc0','#a76ee6','#ddb8ff']},
  {name:'silver',ramp:['#10161d','#2a3540','#4c5c6b','#7c8f9e','#cdd9e2']},
  {name:'crimson',ramp:['#3a0812','#7a1226','#bd2540','#e85068','#ff9fae']},
  {name:'lime',ramp:['#23380a','#47701a','#7db02c','#a7d94e','#dcf59a']},
  {name:'sand',ramp:['#2b2117','#584533','#93765a','#c0a281','#e6d3b4']},
  {name:'basalt',ramp:['#0c1013','#1e262c','#3b474f','#5f6e78','#93a3ad']},
];
let PALETTES=BASE_PALETTES.map(p=>({name:p.name,ramp:p.ramp.slice()}));

// --- rng / noise ---
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash2(x,y,s){let h=x*374761393+y*668265263+s*982451653;h=(h^(h>>>13))*1274126177;return((h^(h>>>16))>>>0)/4294967296;}
function smooth(t){return t*t*(3-2*t);}
// value noise; period P>0 makes the lattice wrap, so a tile seams with itself
function vnoise(x,y,s,P){
  const xi=Math.floor(x),yi=Math.floor(y),xf=smooth(x-xi),yf=smooth(y-yi);
  const wr=v=>P?((v%P)+P)%P:v;
  const x0=wr(xi),x1=wr(xi+1),y0=wr(yi),y1=wr(yi+1);
  const a=hash2(x0,y0,s),b=hash2(x1,y0,s),c=hash2(x0,y1,s),d=hash2(x1,y1,s);
  const top=a+(b-a)*xf,bot=c+(d-c)*xf;return top+(bot-top)*yf;
}
function fbm(x,y,s,oct,gain,P){let amp=1,f=1,sum=0,norm=0;
  for(let i=0;i<oct;i++){sum+=amp*vnoise(x*f,y*f,s+i*7919,P?P*f:0);norm+=amp;amp*=gain;f*=2;}
  return sum/norm;}

// --- shading: ordered dithering ---
// A 4x4 Bayer matrix lets a 5-step ramp imply far more than 5 tones: values that fall
// between two steps alternate between them in a stable pattern instead of snapping.
// This is the cheapest apparent-colour-depth trick in pixel art, and every generator
// quantises through it.
const LIGHT_X=-0.55, LIGHT_Y=-0.83;   // light from upper-left, shared by every generator
const BAYER4=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function shadeIndex(v,x,y,n,amt,cell){
  const k=cell==null||cell<1?1:cell|0;
  const b=(BAYER4[((y/k)|0)&3][((x/k)|0)&3]+0.5)/16-0.5;
  return clamp(Math.floor(v*n+b*(amt==null?0.9:amt)),0,n-1);
}
// pick a role from a ramp of roles by a 0..1 lightness, dithered
function shadeRole(ramp,v,x,y,amt,cell){return ramp[shadeIndex(v,x,y,ramp.length,amt,cell)];}

// --- color ---
function hex2rgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function mix(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function darken(c,t){return mix(c,[3,6,10],t);}function lighten(c,t){return mix(c,[255,255,255],t);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
// Warm the highlights, cool the shadows — hue movement, not just value movement, is
// most of what makes a ramp read as lit rather than as grey-scaled paint. Luminance is
// restored afterwards so the ramp's value structure (and the depth grade) is untouched.
const WARM=[255,186,96], COOL=[62,104,186];
const luma=c=>0.299*c[0]+0.587*c[1]+0.114*c[2];
function tintStep(c,t,strength){
  if(!t)return c;
  const k=Math.abs(t)*(strength==null?0.30:strength);
  const m=mix(c,t>0?WARM:COOL,k);
  const l0=luma(c),l1=Math.max(1,luma(m));
  return[clamp(m[0]*l0/l1,0,255),clamp(m[1]*l0/l1,0,255),clamp(m[2]*l0/l1,0,255)];
}
function corruptColor(c,a){if(a<=0)return c;const l=0.3*c[0]+0.59*c[1]+0.11*c[2];let d=mix(c,[l,l,l],0.62*a);d=mix(d,[201,206,188],0.55*a);return mix(d,[150,172,132],0.18*a);}
// the signature light-absorption curve — red dies first, then green. Shared with the game runtime.
function gradeColor(c,depth){const t=clamp(depth/60,0,1);let r=c[0]*(1-0.88*t),g=c[1]*(1-0.42*t),b=c[2]*(1-0.10*t);r+=(9-r)*0.30*t;g+=(22-g)*0.28*t;b+=(46-b)*0.26*t;const dk=1-0.28*t;return[clamp(r*dk,0,255)|0,clamp(g*dk,0,255)|0,clamp(b*dk,0,255)|0];}

// Every colour is quantised to 8-bit BEFORE the depth grade, so a depth-0 export is
// the exact input a runtime re-grade will see. Without this the tool keeps sub-unit
// precision the exported PNG cannot carry, and tool and runtime drift by a bit or two.
// (reef/tools/verify-grade.mjs asserts they don't.)
function q8(c){return[Math.round(c[0]),Math.round(c[1]),Math.round(c[2])];}
// Authored ramps stay 5 stops (easy to edit by hand); the colorizer interpolates them
// into 9 working tones and drifts hue along the length — cool into the shadows, warm into
// the lights. Value alone reads as greyscale paint; hue movement reads as light.
function expandRamp(hex5){
  const base=hex5.map(hex2rgb),out=[];
  for(let i=0;i<9;i++){
    const t=i/8*4, a=Math.min(3,Math.floor(t)), f=t-a;
    out.push(tintStep(mix(base[a],base[a+1],f), (i/8)*2-1, 0.24));
  }
  return out;
}
function buildColorCache(palIdx,depth,corrupt){
  const pal=PALETTES[palIdx]||PALETTES[0];
  const ramp=pal.ramp.map(hex2rgb), R9=expandRamp(pal.ramp);
  // how far each role sits from neutral: + warms (toward light), - cools (toward shade)
  const TINT={[SPEC]:1.0,[BELLY]:0.62,[HIGH]:0.34,[BASE]:0,[SHADOW]:-0.42,[BACK]:-0.78,
              [PATTERN]:-0.62,[FIN]:-0.30,[TRANS]:0.30,[RIM]:0.40};
  const OL=q8(tintStep(darken(ramp[0],0.55),-0.9));
  const body={[SPEC]:lighten(ramp[4],0.22),[BACK]:ramp[0],[SHADOW]:ramp[1],[BASE]:ramp[2],[HIGH]:ramp[3],
              [BELLY]:mix(ramp[4],[224,236,240],0.5),[FIN]:mix(ramp[1],OL,0.30),[PATTERN]:darken(ramp[0],0.45),
              [TRANS]:mix(ramp[1],[178,210,228],0.24),[RIM]:mix(ramp[3],[255,244,214],0.20)};
  const c={};c[EMPTY]=[0,0,0,0];c[OUTLINE]=[...gradeColor(OL,depth),255];c[FINEDGE]=c[OUTLINE];
  for(const r of[SPEC,BACK,SHADOW,BASE,HIGH,BELLY,PATTERN,RIM])
    c[r]=[...gradeColor(q8(corruptColor(tintStep(body[r],TINT[r],TINT[r]>0?0.30:0.20),corrupt)),depth),255];
  // the nine working tones
  for(let i=0;i<9;i++)
    c[SHADES[i]]=[...gradeColor(q8(corruptColor(R9[i],corrupt)),depth),255];
  c[FIN]=[...gradeColor(q8(corruptColor(tintStep(body[FIN],TINT[FIN]),corrupt)),depth),232];
  // a membrane: fin webbing, sea-fan lattice, soft-coral edges — light passes through it
  c[TRANS]=[...gradeColor(q8(corruptColor(tintStep(body[TRANS],TINT[TRANS]),corrupt)),depth),168];
  c[EYEW]=[...gradeColor([228,236,240],depth),255];
  c[EYEP]=[...gradeColor([10,12,16],depth),255];   // the pupil absorbs light like everything else
  c[EYEH]=[...gradeColor([255,255,255],depth),255];c[MOUTH]=c[OUTLINE];
  const gc=q8(mix([40,120,110],[70,255,225],corrupt));
  c[GLOW]=[...gradeColor(gc,Math.max(0,depth-18)),Math.round(120+120*corrupt)];
  c[GLOWDIM]=[c[GLOW][0],c[GLOW][1],c[GLOW][2],Math.round(c[GLOW][3]*0.45)];
  c[AA]=[c[OUTLINE][0],c[OUTLINE][1],c[OUTLINE][2],124];
  const veil=gradeColor([196,226,238],Math.max(0,depth-10));  // water, not pigment — a shallower curve
  c[HAZE]=[...veil,58];c[HAZE2]=[...veil,124];
  return c;
}

// --- pixel-matrix helpers (shared stamping vocabulary for every generator) ---
function newMat(w,h){const m=new Array(h);for(let y=0;y<h;y++)m[y]=new Uint8Array(w);return m;}
function put(m,w,h,x,y,role,onlyEmpty){x|=0;y|=0;if(x<0||x>=w||y<0||y>=h)return;if(onlyEmpty&&m[y][x])return;m[y][x]=role;}
// thick tapered segment. roleFn(u,t,x,y) — u = -1..1 across the width (lit side positive),
// t = 0..1 along it, x/y the plot coords so the callee can dither.
function stampSeg(m,w,h,x0,y0,x1,y1,w0,w1,roleFn,onlyEmpty){
  const dx=x1-x0,dy=y1-y0,len=Math.hypot(dx,dy)||1,steps=Math.max(2,Math.ceil(len*2));
  const nx=-dy/len,ny=dx/len;
  for(let i=0;i<=steps;i++){const t=i/steps,px=x0+dx*t,py=y0+dy*t,hw=(w0+(w1-w0)*t)/2;
    for(let o=-hw;o<=hw;o+=0.5){const u=hw>0.01?o/hw:0;
      const X=Math.round(px+nx*o),Y=Math.round(py+ny*o);
      put(m,w,h,X,Y,roleFn(u,t,X,Y),onlyEmpty);}}
}
function stampDisc(m,w,h,cx,cy,r,roleFn,onlyEmpty){
  const ri=Math.ceil(r);
  for(let dy=-ri;dy<=ri;dy++)for(let dx=-ri;dx<=ri;dx++){const d=Math.hypot(dx,dy);if(d>r)continue;
    const X=Math.round(cx+dx),Y=Math.round(cy+dy);
    put(m,w,h,X,Y,roleFn(d/(r||1),dx,dy,X,Y),onlyEmpty);}
}
// Wrap every solid pixel in OUTLINE — but the edge facing the light gets RIM instead.
// A single flat outline all the way round is what flattens pixel art; letting the lit
// side catch a warm rim is most of the difference between a sticker and a solid object.
// `soft` roles (haze/glow) neither outline nor block one.
const SHADE_IDX={};SHADES.forEach((r,i)=>SHADE_IDX[r]=i);
const isShade=r=>SHADE_IDX[r]!==undefined;
function shadeDown(role,n){const i=SHADE_IDX[role];return i===undefined?undefined:SHADES[clamp(i-(n==null?1:n),0,8)];}
const SOFT_ROLES=new Set([HAZE,HAZE2,GLOW,GLOWDIM]);
function outlinePass(m,w,h,rimStrength){
  const rim=rimStrength==null?0.55:rimStrength;
  const add=[];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    if(m[y][x])continue;
    const n=(xx,yy)=>xx>=0&&xx<w&&yy>=0&&yy<h&&m[yy][xx]&&!SOFT_ROLES.has(m[yy][xx]);
    const l=n(x-1,y),r=n(x+1,y),u=n(x,y-1),d=n(x,y+1);
    if(!(l||r||u||d))continue;
    // the outward normal of this edge pixel: it points away from whatever solid it touches
    const nx=(l?1:0)-(r?1:0), ny=(u?1:0)-(d?1:0);
    const lit=(nx*LIGHT_X+ny*LIGHT_Y);
    add.push([y*w+x, (rim>0 && lit>0.62) ? RIM : OUTLINE]);
  }
  for(const [p,role] of add)m[(p/w)|0][p%w]=role;
}
// Selective anti-aliasing. Raster stair-steps are what make a generated sprite read as
// rasterised rather than drawn; a pixel artist softens the notch at each convex corner of
// a shallow slope. Against transparency the correct "intermediate tone" is a partially
// transparent edge pixel, which is what AA is. Deliberately NOT run on tiles — it would
// eat the very edges the autotiler relies on.
function aaPass(m,w,h){
  const solid=(x,y)=>x>=0&&x<w&&y>=0&&y<h&&m[y][x]&&!SOFT_ROLES.has(m[y][x])&&m[y][x]!==AA;
  const add=[];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    if(m[y][x])continue;
    const l=solid(x-1,y),r=solid(x+1,y),u=solid(x,y-1),d=solid(x,y+1);
    const n=(l?1:0)+(r?1:0)+(u?1:0)+(d?1:0);
    if(n!==2||(l&&r)||(u&&d))continue;          // a corner notch, not a slot or a spike
    // only soften genuinely shallow steps — a 1px spur should stay sharp
    const shallow=(l&&solid(x-2,y))||(r&&solid(x+2,y))||(u&&solid(x,y-2))||(d&&solid(x,y+2));
    if(shallow)add.push(y*w+x);
  }
  for(const p of add)m[(p/w)|0][p%w]=AA;
}
// Darken pixels tucked under other geometry. Cheap screen-space AO: count solid
// neighbours on the light side; the more there are, the more occluded the pixel is.
const AO_DOWN={[SPEC]:HIGH,[BELLY]:HIGH,[HIGH]:BASE,[BASE]:SHADOW,[SHADOW]:BACK,[RIM]:HIGH,[TRANS]:FIN};
const aoTarget=r=>{const d=shadeDown(r,1);return d!==undefined?d:AO_DOWN[r];};
function aoPass(m,w,h,radius,strength){
  const R=radius==null?3:radius, k=strength==null?3:strength;
  const src=m.map(r=>r.slice());
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const role=src[y][x];
    const to=aoTarget(role);
    if(to===undefined)continue;
    let occ=0;
    for(let i=1;i<=R;i++){
      const sx=Math.round(x+LIGHT_X*i), sy=Math.round(y+LIGHT_Y*i);
      if(sx<0||sx>=w||sy<0||sy>=h)continue;
      const q=src[sy][sx];
      if(q&&!SOFT_ROLES.has(q)&&q!==OUTLINE&&q!==RIM)occ++;
    }
    if(occ>=k)m[y][x]=to;
  }
}

// ===================== MODULE REGISTRY =====================
// The explicit contract every generator implements, so the rail UI, the animation
// system and the exporters are written exactly once:
//
//   Module = {
//     id, label, icon, size:{w,h} (nominal — generate() returns the real frame), fit,
//     groups:      [{key,title}]                      // rail panels
//     paramSchema: [{key,group,label,type,...}]       // -> auto-generated rail controls
//     defaults()   -> cfg                             // module-specific keys only
//     generate(cfg,rng)            -> {w,h,roles,meta}          // motion-animated
//     generateFrames(cfg,rng,clip) -> {w,h,frames:[roles],meta}  // pre-baked (baked:true)
//     motions:     ['swim',...]                       // which motion models apply
//     clips()      -> [clip]                          // starting timeline
//   }
const MODULES=[];
function defModule(m){MODULES.push(m);return m;}
function modById(id){return MODULES.find(m=>m.id===id)||MODULES[0];}

// ===================== MODULE: CREATURE =====================
const ARCHES=['reef','angel','eel','puffer','predator'];
const ARCH_META={reef:{len:0.52,dep:0.52,curve:0},angel:{len:0.40,dep:0.84,curve:0},eel:{len:0.86,dep:0.22,curve:3.2},puffer:{len:0.50,dep:0.70,curve:0},predator:{len:0.80,dep:0.32,curve:0,jaw:1}};
const TAILS=['fork','fan','lunate','round','point'];
const DORSALS=['none','low','sail','spiny'];
const PATTERNS=['none','v-stripes','h-stripes','spots','diagonal','patches'];

const BODY_RAMP=SHADES;
// Snout profile per archetype: how sharply the front of the body tapers to the mouth.
const SNOUT={reef:0.34,angel:0.20,eel:0.30,puffer:0.10,predator:0.66};

function generateCreature(c,rng){
  // RS scales the whole frame. Detail is pixel-budget-capped at 72x42 — you cannot draw a
  // gill cover in three pixels — so every absolute measurement below scales with it.
  const RS=Math.max(1,c.res||1);
  const w=Math.round(72*RS),h=Math.round(42*RS),cy=h/2,A=ARCH_META[c.arch]||ARCH_META.reef;
  const rx=clamp(A.len*c.len*(w*0.5),8*RS,w*0.5-2),ry=clamp(A.dep*c.dep*(h*0.5),4*RS,h*0.5-3);
  const cx=Math.round(w*0.50+rx*0.06);
  const roles=newMat(w,h);
  const topEdge=new Int16Array(w).fill(-1),botEdge=new Int16Array(w).fill(-1);
  const set=(x,y,r,onlyEmpty)=>put(roles,w,h,x,y,r,onlyEmpty);
  const curveAt=x=>A.curve?A.curve*RS*Math.sin((x-cx)*0.18/RS):0;
  const DC=Math.max(1,Math.round(RS));       // dither cell grows with the frame, so the
                                             // weave stays the same size on screen
  const snout=SNOUT[c.arch]!==undefined?SNOUT[c.arch]:0.3;

  // ---- fins: membrane stretched over rays ---------------------------------------
  // Shaded by distance from the root and striped radially, so a tail fans open instead
  // of reading as one flat paddle.
  const finRole=(u,ray,x,y)=>{
    if(u>0.78&&!ray)return TRANS;
    return shadeRole(SHADES,clamp(0.32-u*0.16+(ray?0.10:-0.05),0,1),x,y,0.5,DC);
  };
  const rayAt=(x,y,ox,oy,spacing)=>((Math.floor(Math.atan2(y-oy,x-ox)/spacing)&1)===0);

  const tailLen=Math.round(clamp(ry*1.5,8*RS,17*RS)),bx=Math.round(cx-rx);
  {
    const yc=cy+curveAt(bx);
    for(let i=0;i<=tailLen;i++){
      const x=bx-i;if(x<1)break;const t=i/tailLen;let half;
      if(c.tail==='fan')half=ry*(0.35+0.95*t);
      else if(c.tail==='round')half=ry*(0.30+0.62*Math.sin(Math.PI*0.5*t));
      else if(c.tail==='point')half=ry*(0.55*(1-t))+1;
      else half=ry*(0.30+1.02*t);
      half=Math.round(half);
      const put1=y=>{const yy=Math.round(y);
        set(x,yy,finRole(t,rayAt(x,yy,bx+2,yc,0.17),x,yy));};
      if(c.tail==='fork'||c.tail==='lunate'){
        const notch=Math.round(half*(c.tail==='lunate'?0.85:0.72)*t);
        for(let y=yc-half;y<=yc-notch;y++)put1(y);
        for(let y=yc+notch;y<=yc+half;y++)put1(y);
        if(t<0.25)for(let y=yc-2*RS;y<=yc+2*RS;y++)put1(y);
      } else for(let y=yc-half;y<=yc+half;y++)put1(y);
    }
  }
  // pectoral fin
  {const px=Math.round(cx+rx*0.20),py=Math.round(cy+curveAt(px)+ry*0.15),pl=Math.round(ry*0.9);
   for(let i=0;i<pl;i++){const ww=Math.round((1-i/pl)*ry*0.5);
     for(let j=0;j<=ww;j++){const xx=px-j,yy=py+i;
       set(xx,yy,finRole(i/pl,rayAt(xx,yy,px,py-1,0.30),xx,yy),true);}}}

  // ---- body -------------------------------------------------------------------
  for(let x=Math.round(cx-rx);x<=Math.round(cx+rx);x++){
    const dx=(x-cx)/rx;if(Math.abs(dx)>1)continue;
    let hh=ry*Math.sqrt(Math.max(0,1-dx*dx));
    // taper the front into a snout rather than leaving a bare half-ellipse
    if(dx>0.42)hh*=1-snout*Math.pow((dx-0.42)/0.58,1.6);
    const yc=cy+curveAt(x),topH=hh*0.92,botH=hh*1.08;
    const yTop=Math.round(yc-topH),yBot=Math.round(yc+botH);
    topEdge[x]=yTop;botEdge[x]=yBot;const span=Math.max(1,yBot-yTop);
    for(let y=yTop;y<=yBot;y++){
      const f=(y-yTop)/span;                                  // 0 dorsal, 1 ventral
      let v=0.05+0.90*f;                                      // countershading
      v-=0.22*Math.pow(Math.abs(dx),2.4);                     // cylindrical falloff
      set(x,y,shadeRole(BODY_RAMP,clamp(v,0,1),x,y,0.55,DC));
    }
  }

  // ---- dorsal / anal fins ------------------------------------------------------
  if(c.dorsal!=='none'){
    const x0=Math.round(cx-rx*0.42),x1=Math.round(cx+rx*0.26);
    for(let x=x0;x<=x1;x++){if(topEdge[x]<0)continue;let hgt;
      if(c.dorsal==='low')hgt=ry*0.34;
      else if(c.dorsal==='sail')hgt=ry*(0.55+0.45*Math.sin(Math.PI*(x-x0)/Math.max(1,x1-x0)));
      else hgt=ry*(0.30+0.42*Math.abs(Math.sin(x*0.95/RS)));
      hgt=Math.round(hgt);
      const ray=((Math.floor(x/(1.6*RS)))&1)===0;
      for(let k=1;k<=hgt;k++)set(x,topEdge[x]-k,finRole(k/hgt,ray,x,topEdge[x]-k),true);}
  }
  if(c.arch!=='eel'){
    const x0=Math.round(cx-rx*0.15),x1=Math.round(cx+rx*0.12),hgt=Math.round(ry*0.22);
    for(let x=x0;x<=x1;x++){if(botEdge[x]<0)continue;
      const ray=((Math.floor(x/(1.6*RS)))&1)===0;
      for(let k=1;k<=hgt;k++)set(x,botEdge[x]+k,finRole(k/hgt,ray,x,botEdge[x]+k),true);}
  }

  // ---- surface detail ----------------------------------------------------------
  const bodyAt=(x,y)=>x>=0&&x<w&&y>=0&&y<h&&isShade(roles[y][x])&&topEdge[x]>=0&&y>=topEdge[x]&&y<=botEdge[x];
  // scales: staggered rows of scalloped arcs, one step darker on each arc's trailing edge
  if(c.scales>0.01){
    const sw2=Math.max(3,Math.round(3.4*RS)),sh2=Math.max(2,Math.round(2.6*RS));
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      if(!bodyAt(x,y))continue;
      const row=Math.floor(y/sh2),ox=(row&1)*sw2/2;
      const fx=(((x+ox)%sw2)+sw2)%sw2/sw2-0.5, fy=((y%sh2)+sh2)%sh2/sh2;
      if(fy>0.70&&Math.abs(fx)<0.40&&hash2(x,y,c.seed+3)<c.scales)
        roles[y][x]=shadeDown(roles[y][x],1);
    }
  }
  // gill cover: the plate behind the head, with a lit leading edge
  {const gx=Math.round(cx+rx*0.34);
   for(let x=gx-1;x<=gx+1;x++)for(let y=0;y<h;y++){
     if(!bodyAt(x,y))continue;
     const t=(y-topEdge[x])/Math.max(1,botEdge[x]-topEdge[x]);
     const bow=Math.round(Math.sin(t*Math.PI)*ry*0.16);
     if(x===gx-1+bow)roles[y][x]=shadeDown(roles[y][x],2);
     else if(x===gx+bow&&t>0.18&&t<0.82)roles[y][x]=shadeRole(SHADES,0.66,x,y,0.4,DC);}}
  // lateral line: a dashed seam along the flank
  {const y0=x=>Math.round(topEdge[x]+(botEdge[x]-topEdge[x])*0.44);
   for(let x=Math.round(cx-rx*0.7);x<=Math.round(cx+rx*0.34);x++){
     if(topEdge[x]<0)continue;const y=y0(x);
     if(!bodyAt(x,y))continue;
     if((Math.floor(x/(2*RS))&1)===0)roles[y][x]=shadeDown(roles[y][x],1);}}

  // ---- markings ----------------------------------------------------------------
  const spots=[];
  if(c.pattern==='spots'){const n=4+Math.floor(rng()*5);
    for(let i=0;i<n;i++)spots.push([cx-rx*0.4+rng()*rx*1.2,cy-ry*0.5+rng()*ry,(1.4+rng()*1.6)*RS]);}
  const sw=Math.max(3,Math.round(6.5*RS)),ph=Math.floor(rng()*4*RS);
  const patHit=(x,y)=>{switch(c.pattern){
    case'v-stripes':return((x-ph)%sw+sw)%sw<sw*0.30;
    case'h-stripes':return(y%sw)<sw*0.4;
    case'diagonal':return((x+y)%sw)<sw*0.5;
    case'spots':return spots.some(s=>((x-s[0])**2+(y-s[1])**2)<s[2]*s[2]);
    case'patches':return hash2(Math.floor(x/(2*RS)),Math.floor(y/(2*RS)),c.seed)>0.58;
    default:return false;}};
  if(c.pattern!=='none')for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const r=roles[y][x];
    if(!isShade(r)||!patHit(x,y))continue;
    roles[y][x]=SHADE_IDX[r]<2?PATTERN:shadeDown(r,2);}

  // ---- head: mouth, jaw, eye ---------------------------------------------------
  {const mx=Math.round(cx+rx*0.86),my=Math.round(cy+curveAt(mx)+ry*(A.jaw?0.16:0.24));
   const len=Math.round(rx*(A.jaw?0.22:0.13));
   for(let i=0;i<len;i++){const x=mx-i;
     if(bodyAt(x,my))roles[my][x]=MOUTH;
     if(A.jaw&&bodyAt(x,my+1))roles[my+1][x]=shadeDown(roles[my+1][x],2);}}
  const ex=Math.round(cx+rx*0.58),ey=Math.round(cy+curveAt(ex)-ry*0.30);
  const er=Math.max(2,Math.round(ry*0.17));
  const drawEye=(exx,eyy,rr)=>{
    stampDisc(roles,w,h,exx,eyy,rr+Math.max(1,rr*0.28),()=>shadeRole(SHADES,0.10,exx,eyy,0,1)); // socket
    stampDisc(roles,w,h,exx,eyy,rr,()=>EYEW);                                                   // sclera
    stampDisc(roles,w,h,exx,eyy,rr*0.66,()=>PATTERN);                                           // iris
    stampDisc(roles,w,h,exx,eyy,rr*0.40,()=>EYEP);                                              // pupil
    stampDisc(roles,w,h,exx-rr*0.34,eyy-rr*0.34,Math.max(0.7,rr*0.24),()=>EYEH);                // catchlight
  };
  drawEye(ex,ey,er);
  if(c.corrupt>0.6)drawEye(ex-Math.round(rx*0.22),ey+Math.round(RS),Math.max(1.4,er*0.7));
  if(c.corrupt>0.4){const gr=er+Math.round(2*RS);
    for(let dy=-gr;dy<=gr;dy++)for(let dx=-gr;dx<=gr;dx++){const d=dx*dx+dy*dy;
      if(d<=gr*gr&&d>er*er)set(ex+dx,ey+dy,GLOW,true);}}

  // ---- specular ridge + membranes + finish -------------------------------------
  {const x0=Math.round(cx-rx*0.18),x1=Math.round(cx+rx*0.60);
   for(let x=x0;x<=x1;x++){
     if(x<0||x>=w||topEdge[x]<0)continue;
     const t=(x-x0)/Math.max(1,x1-x0),strength=Math.sin(Math.PI*t);
     for(let k=0;k<Math.max(2,Math.round(2*RS));k++){
       const y=topEdge[x]+k;if(y<0||y>=h)continue;
       const r=roles[y][x];if(!isShade(r)&&r!==PATTERN)continue;
       if(shadeIndex(strength*(1-k*0.5/RS),x,y,2,1.25,DC))roles[y][x]=SPEC;}}}

  aoPass(roles,w,h,Math.round(3*RS),3);
  outlinePass(roles,w,h);
  aaPass(roles,w,h);
  return{w,h,roles,meta:{cx,cy,headX:cx+rx,tailX:bx-tailLen,ry,
    anchors:{eye:[ex,ey],mouth:[Math.round(cx+rx),Math.round(cy+curveAt(cx+rx))]}}};
}

defModule({
  id:'creature',label:'Creatures',icon:'\u{1F41F}',size:{w:72,h:42},fit:1.5,
  groups:[{key:'body',title:'Body plan'},{key:'fins',title:'Fins &amp; tail'},{key:'skin',title:'Skin'}],
  paramSchema:[
    {key:'arch',group:'body',label:'Archetype',type:'chips',options:ARCHES},
    {key:'len',group:'body',label:'Length',type:'range',min:0.7,max:1.3,step:0.01,fmt:v=>v.toFixed(2)+'×'},
    {key:'dep',group:'body',label:'Body depth',type:'range',min:0.7,max:1.3,step:0.01,fmt:v=>v.toFixed(2)+'×'},
    {key:'tail',group:'fins',label:'Tail',type:'chips',options:TAILS},
    {key:'dorsal',group:'fins',label:'Dorsal',type:'chips',options:DORSALS},
    {key:'pattern',group:'skin',label:'Pattern',type:'chips',options:PATTERNS},
    {key:'res',group:'body',label:'Resolution',type:'range',min:1,max:3,step:0.5,fmt:v=>Math.round(72*v)+'×'+Math.round(42*v)},
    {key:'scales',group:'skin',label:'Scales',type:'range',min:0,max:1,step:0.02,fmt:v=>v<0.01?'off':Math.round(v*100)+'%'}
  ],

// ===================== MODULE: FLORA =====================
// L-system string rewriting -> turtle that stamps thick tapered segments into the
// role matrix. Countershading comes from the segment normal vs. a fixed light dir,
// so branches read as round the same way creature bodies do.
const FLORA_ARCH={
  kelp:    {rules:{X:['F[+f]X','F[-f]X','FX','F[+f][-f]X']},          angle:58,iterMul:4.0,len:1.00,wid:1.20,tipR:0.9,curlMul:1.0,strandSpread:7,leaf:[1.15,0.75]},
  staghorn:{rules:{X:['F[+X][-X]','F[+X]X','F[-X]X','FF[+X][-X]']},   angle:30,iterMul:1.6,len:0.98,wid:1.20,tipR:1.5,curlMul:0.7,strandSpread:9,leaf:[0.6,0.5]},
  fan:     {rules:{X:['F[+X][-X]']},                                  angle:17,iterMul:1.7,len:0.94,wid:0.72,tipR:0.7,curlMul:0.3,strandSpread:5,membrane:1,leaf:[0.6,0.5]},
  soft:    {rules:{X:['F[+X][-X]','FX','F[+X][-X]']},                 angle:42,iterMul:1.3,len:0.90,wid:2.60,tipR:1.9,curlMul:0.9,strandSpread:8,leaf:[0.6,0.6]},
  grass:   {rules:{X:['FX']},                                         angle:20,iterMul:4.0,len:1.00,wid:0.80,tipR:0.5,curlMul:2.2,strandSpread:11,leaf:[0.7,0.5]}
};
const FLORA_KEYS=Object.keys(FLORA_ARCH);
const LIGHT=[LIGHT_X,LIGHT_Y];

function lsysExpand(axiom,rules,iter,rng){
  let s=axiom;
  for(let i=0;i<iter;i++){
    let out='';
    for(let k=0;k<s.length;k++){const ch=s[k],r=rules[ch];
      out+=r?(Array.isArray(r)?r[(rng()*r.length)|0]:r):ch;}
    s=out;
    if(s.length>20000)break;
  }
  return s;
}
// skip from an unwanted '[' to its matching ']'
function skipBranch(s,i){let d=0;for(;i<s.length;i++){if(s[i]==='[')d++;else if(s[i]===']'){d--;if(!d)return i;}}return s.length;}

function generateFlora(c,rng){
  const w=64,h=80,baseY=h-3,A=FLORA_ARCH[c.arch]||FLORA_ARCH.kelp;
  const roles=newMat(w,h),tips=[];
  const iter=Math.max(1,Math.round(c.iter*A.iterMul));
  const strands=Math.max(1,Math.round(c.strands));
  // Each L-system iteration adds roughly one segment along any path, so normalising
  // segment length by the iteration count keeps every archetype filling the frame —
  // the slider then reads as a relative multiplier instead of raw pixels.
  const baseLen=clamp((h*0.80)/iter*A.len*c.height*c.seglen,1.4,26);
  const baseWid=Math.max(1,c.width*A.wid*c.height*clamp(baseLen/4.5,0.85,1.8));
  // taper is normalised the same way: the whole plant thins by the same amount whether
  // it grew in 6 fat segments or 20 fine ones
  const taperStep=Math.pow(clamp(c.taper,0.5,1),6/iter);
  let minY=baseY;

  // Lightness across a segment: the lit side is bright, the shaded side dark, and the
  // whole plant sits deeper in shade toward its base. Quantised through the dither so a
  // 3px stem can still imply a round surface.
  const FLORA_RAMP=SHADES;
  const segRole=(u,litSign,py,px)=>{
    const sgn=u*litSign, deep=clamp((py-h*0.42)/(h*0.58),0,1);
    let v=0.50+sgn*0.44-deep*0.17;
    return shadeRole(FLORA_RAMP,clamp(v,0,1),px,py,0.7);
  };

  for(let sIdx=0;sIdx<strands;sIdx++){
    const srng=mulberry32((c.seed>>>0)+sIdx*7717);
    const str=lsysExpand('X',A.rules,iter,srng);
    const spread=(strands>1?(sIdx/(strands-1)-0.5):0)*A.strandSpread;
    let t={x:w/2+spread*1.4,y:baseY,ang:-Math.PI/2+spread*0.055,len:baseLen,wid:baseWid};
    const stack=[];
    let segs=0;
    for(let i=0;i<str.length&&segs<3000;i++){
      const ch=str[i];
      if(ch==='['){
        if(srng()>c.branch){i=skipBranch(str,i);continue;}
        stack.push({...t});
      }
      else if(ch===']'){ if(stack.length)t=stack.pop(); }
      else if(ch==='+'){ t.ang+=(c.angle*Math.PI/180)*A.angle/30*(0.72+srng()*0.56); }
      else if(ch==='-'){ t.ang-=(c.angle*Math.PI/180)*A.angle/30*(0.72+srng()*0.56); }
      else if(ch==='F'||ch==='f'){
        const leaf=ch==='f';
        const ln=Math.max(1.2,t.len*(leaf?A.leaf[0]:1)),wd=Math.max(0.9,t.wid*(leaf?A.leaf[1]:1));
        t.ang+=(c.curl*A.curlMul*0.16)+(srng()-0.5)*0.09;
        const nx0=t.x+Math.cos(t.ang)*ln, ny0=t.y+Math.sin(t.ang)*ln;
        const dx=nx0-t.x,dy=ny0-t.y,L=Math.hypot(dx,dy)||1;
        const litSign=Math.sign((-dy/L)*LIGHT[0]+(dx/L)*LIGHT[1])||1;
        const w1=Math.max(0.9,wd*taperStep);
        stampSeg(roles,w,h,t.x,t.y,nx0,ny0,wd,w1,(u,tt,px,py)=>segRole(u,litSign,py,px));
        t.x=nx0;t.y=ny0;t.wid=leaf?t.wid:w1;t.len=Math.max(1.2,t.len*(0.965+taperStep*0.035));
        if(ny0<minY)minY=ny0;
        segs++;
        // a branch that ends here (next symbol closes it, or is an unexpanded apex) grows a tip cluster
        const nxt=str[i+1];
        if(leaf||nxt===undefined||nxt===']'||nxt==='X')tips.push([nx0,ny0,t.wid]);
      }
    }
  }

  // sea-fan membrane: web adjacent tips together into a flat lattice
  if(A.membrane){
    const lim=baseLen*1.55;
    const step=Math.max(1,Math.ceil(tips.length/700)),pool=tips.filter((_,i)=>i%step===0);
    for(let a=0;a<pool.length;a++)for(let b=a+1;b<pool.length;b++){
      const d=Math.hypot(pool[a][0]-pool[b][0],pool[a][1]-pool[b][1]);
      if(d>0.8&&d<lim)stampSeg(roles,w,h,pool[a][0],pool[a][1],pool[b][0],pool[b][1],1,1,()=>TRANS,true);
    }
  }

  // polyps / blade tips — bioluminescent variants glow instead
  for(const tp of tips){
    const r=A.tipR*c.tipsize*(0.75+tp[2]*0.22);
    if(r<0.7)continue;
    stampDisc(roles,w,h,tp[0],tp[1],r,(d,dx,dy)=>{
      if(c.bio)return d<0.5?GLOW:GLOWDIM;
      const len=Math.max(0.7,Math.hypot(dx,dy)),lit=(dx*LIGHT[0]+dy*LIGHT[1])/len;
      if(d<0.4&&lit>0.1)return SPEC;
      return shadeRole([S4,S5,S6,S7,S8],clamp(0.5+lit*0.55,0,1),Math.round(tp[0]+dx),Math.round(tp[1]+dy),0.6);});
  }
  if(c.bio)for(const tp of tips)stampDisc(roles,w,h,tp[0],tp[1],A.tipR*c.tipsize+2.4,()=>GLOWDIM,true);

  // holdfast
  const hw=Math.max(3,strands*A.strandSpread*0.45);
  for(let x=-hw;x<=hw;x++){const hgt=Math.round(2.4*Math.cos(x/hw*1.3));
    for(let y=0;y<=hgt+1;y++)put(roles,w,h,Math.round(w/2+x),baseY+1-y,y>hgt-1?SHADOW:BACK,true);}

  aoPass(roles,w,h,3,3);
  outlinePass(roles,w,h);
  const height=Math.max(6,baseY-minY);
  return{w,h,roles,meta:{cx:w/2,cy:h/2,baseY,height,
    anchors:{base:[Math.round(w/2),baseY],tips:tips.slice(0,24).map(t=>[Math.round(t[0]),Math.round(t[1])])}}};
}

// ===================== MODULE: TILES =====================
// Noise-filled material + a 47-tile blob autotile set built from edge/corner masks.
// Neighbour bits: the four diagonals only count when both of their cardinals are set,
// which collapses the 256 raw neighbourhoods onto exactly 47 distinct tiles.
const TS=16;
const NB_N=1,NB_NE=2,NB_E=4,NB_SE=8,NB_S=16,NB_SW=32,NB_W=64,NB_NW=128;
function blobKey(mask){let k=mask;
  if(!(k&NB_N)||!(k&NB_E))k&=~NB_NE;
  if(!(k&NB_E)||!(k&NB_S))k&=~NB_SE;
  if(!(k&NB_S)||!(k&NB_W))k&=~NB_SW;
  if(!(k&NB_W)||!(k&NB_N))k&=~NB_NW;
  return k>>>0;}
const MASK_TO_KEY=new Uint8Array(256);
const BLOB_KEYS=(function(){const seen=new Map();
  for(let m=0;m<256;m++){const k=blobKey(m);MASK_TO_KEY[m]=k;if(!seen.has(k))seen.set(k,1);}
  return[...seen.keys()].sort((a,b)=>a-b);})();          // 47 entries
const KEY_TO_INDEX=(function(){const o={};BLOB_KEYS.forEach((k,i)=>o[k]=i);return o;})();

const MATERIALS=['sand','rock','rubble','crust'];
const EDGE_STYLES=['hard','soft','rounded'];

function tileFill(c,x,y){
  const s=c.seed>>>0, k=0.60+c.contrast*1.6;
  const sc=c.grain<0.34?8:c.grain<0.67?4:2;
  // Smooth, periodic cell noise: the lattice wraps at the tile edge (so a tile always
  // seams with a copy of itself) and stays coarse enough that quantising it yields
  // stone-sized cells rather than per-pixel confetti.
  const nz=(xx,yy,scale,off)=>0.72*vnoise(xx/scale,yy/scale,s+off,TS/scale)
                             +0.28*vnoise(xx/(scale*0.5),yy/(scale*0.5),s+off+13,TS/(scale*0.5));
  const band=(xx,yy,bands,scale,off)=>Math.min(bands-1,(clamp(0.5+(nz(xx,yy,scale,off)-0.5)*k,0,0.9999)*bands)|0);

  if(c.material==='sand'){
    const fine=Math.max(2,sc/2),g=hash2(x,y,s+11);
    let r=shadeRole([S3,S4,S5,S6,S7,S8],clamp(0.5+(nz(x,y,fine,0)-0.5)*k,0,1),x,y,0.25);
    if(g>0.945)r=SPEC;else if(g<0.055)r=SHADOW;
    return r;
  }
  // rock & rubble are "stones": quantise the cell noise, seam the lower-right of each
  // cell and catch light on its upper-left. Cheap, and it reads as packed stone.
  if(c.material==='rock'||c.material==='rubble'){
    const rubble=c.material==='rubble';
    const scale=rubble?sc:Math.min(8,sc*2),bands=3;
    const ramp=rubble?[S2,S4,S6,S8]:[S2,S4,S6];
    const q=(xx,yy)=>band(xx,yy,bands,scale,0),me=q(x,y);
    if(me!==q(x+1,y)||me!==q(x,y+1))return rubble?S1:S0;                       // shaded seam
    if(me!==q(x-1,y)||me!==q(x,y-1))return ramp[Math.min(ramp.length-1,me+1)];// lit lip
    if(!rubble&&Math.abs(vnoise(x/8,y/8,s+301,2)-0.5)<0.045)return S1;        // hairline crack
    const g=hash2(x,y,s+7);
    if(g>0.94)return ramp[Math.min(ramp.length-1,me+1)];
    if(g<0.06)return me?ramp[me-1]:S0;
    return shadeRole(ramp,clamp(0.5+(nz(x,y,scale,0)-0.5)*k,0,1),x,y,0.25);
  }
  // coral crust — mottled, with polyp specks and the odd bioluminescent pinprick
  const m2=band(x,y,4,Math.max(2,sc/2),977),g=hash2(x,y,s+29);
  let r=shadeRole([S2,S3,S4,S5,S6],clamp(0.5+(nz(x,y,sc,0)-0.5)*k,0,1),x,y,0.25);
  if(m2===3)r=PATTERN;
  if(g>0.965)r=SPEC;else if(g>0.945)r=BELLY;else if(g<0.012)r=GLOW;
  return r;
}

function renderTile(c,key){
  const m=newMat(TS,TS),has=b=>(key&b)!==0;
  for(let y=0;y<TS;y++)for(let x=0;x<TS;x++)m[y][x]=tileFill(c,x,y);
  const soft=c.edge==='soft',rounded=c.edge==='rounded';
  const band=(x,y,role)=>{if(x>=0&&x<TS&&y>=0&&y<TS)m[y][x]=role;};
  // exposed faces: light from upper-left, so the top lip is brightest, the underside darkest
  if(!has(NB_N))for(let x=0;x<TS;x++){if(!soft)band(x,0,OUTLINE);band(x,soft?0:1,SPEC);band(x,soft?1:2,HIGH);}
  if(!has(NB_S))for(let x=0;x<TS;x++){if(!soft)band(x,TS-1,OUTLINE);band(x,TS-(soft?1:2),BACK);band(x,TS-(soft?2:3),SHADOW);}
  if(!has(NB_W))for(let y=0;y<TS;y++){if(!soft)band(0,y,OUTLINE);band(soft?0:1,y,HIGH);}
  if(!has(NB_E))for(let y=0;y<TS;y++){if(!soft)band(TS-1,y,OUTLINE);band(TS-(soft?1:2),y,SHADOW);}

  const corners=[[NB_N,NB_W,NB_NW,0,0],[NB_N,NB_E,NB_NE,1,0],[NB_S,NB_W,NB_SW,0,1],[NB_S,NB_E,NB_SE,1,1]];
  const r=rounded?4:soft?2:3;
  for(const[ca,cb,cd,sx,sy]of corners){
    const px=(i,j)=>[sx?TS-1-i:i, sy?TS-1-j:j];
    if(!has(ca)&&!has(cb)){
      // outer corner — carve it round, then re-edge whatever the carve exposed
      for(let i=0;i<r;i++)for(let j=0;j<r;j++)
        if(Math.hypot(r-i-0.5,r-j-0.5)>r-0.3){const[x,y]=px(i,j);m[y][x]=EMPTY;}
      for(let i=0;i<r+2;i++)for(let j=0;j<r+2;j++){const[x,y]=px(i,j);
        if(x<0||x>=TS||y<0||y>=TS||!m[y][x])continue;
        const hole=(xx,yy)=>xx>=0&&xx<TS&&yy>=0&&yy<TS&&!m[yy][xx];
        if(hole(x-1,y)||hole(x+1,y)||hole(x,y-1)||hole(x,y+1))m[y][x]=OUTLINE;}
    } else if(has(ca)&&has(cb)&&!has(cd)){
      // inner corner — a concave crease where the diagonal neighbour is missing
      for(let i=0;i<r+1;i++)for(let j=0;j<r+1;j++){
        const d=Math.hypot(i+0.5,j+0.5);if(d>r)continue;const[x,y]=px(i,j);
        m[y][x]=d<r*0.62?OUTLINE:(sy?BACK:SHADOW);}
    }
  }
  return m;
}

// One fill per blob key makes a 16px pattern that repeats across the whole seabed. Cheap
// fix: render the same 47 keys N times from offset seeds and let the map pick between
// them per cell. Exported as one row per variant, so the engine picks a row at random.
function buildTileset(c){
  const V=Math.max(1,Math.round(c.variants||1)),out=[];
  for(let v=0;v<V;v++){
    const cv=Object.assign({},c,{seed:(c.seed>>>0)+v*104729});
    out.push(BLOB_KEYS.map(k=>renderTile(cv,k)));
  }
  return out;                       // [variant][tileIndex]
}

// the in-context preview: a seabed of this material, autotiled so the seams are visible
function generateTiles(c,rng){
  const GW=9,GH=6,w=GW*TS,h=GH*TS;
  const solid=[];
  for(let gy=0;gy<GH;gy++){solid.push([]);
    for(let gx=0;gx<GW;gx++){
      const n=fbm(gx/2.2,gy/2.0,(c.seed>>>0)+5,2,0.55,0);
      solid[gy][gx]=gy>=GH-2 ? true : n>1-c.coverage;
    }}
  const set=buildTileset(c),V=set.length,roles=newMat(w,h);
  const at=(gx,gy)=>(gx<0||gx>=GW||gy>=GH)?(gy>=GH):(gy<0?false:solid[gy][gx]);
  for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){
    if(!solid[gy][gx])continue;
    let mask=0;
    if(at(gx,gy-1))mask|=NB_N; if(at(gx+1,gy-1))mask|=NB_NE; if(at(gx+1,gy))mask|=NB_E;
    if(at(gx+1,gy+1))mask|=NB_SE;if(at(gx,gy+1))mask|=NB_S;  if(at(gx-1,gy+1))mask|=NB_SW;
    if(at(gx-1,gy))mask|=NB_W;   if(at(gx-1,gy-1))mask|=NB_NW;
    const variant=Math.min(V-1,(hash2(gx,gy,(c.seed>>>0)+31)*V)|0);
    const tile=set[variant][KEY_TO_INDEX[MASK_TO_KEY[mask]]];
    for(let y=0;y<TS;y++)for(let x=0;x<TS;x++){const r=tile[y][x];if(r)roles[gy*TS+y][gx*TS+x]=r;}
  }
  return{w,h,roles,meta:{cx:w/2,cy:h/2,tileSize:TS,tileset:set,grid:{cols:GW,rows:GH},anchors:{origin:[0,0]}}};
}

// ===================== MODULE: VFX =====================
// Pre-baked looping effects: particle constants are drawn once from the seed, then
// evaluated per frame. Every particle advances a whole number of cycles across the
// clip, so frame F wraps onto frame 0 exactly — no seam, at any frame count.
const EFFECTS=['bubbles','silt','godray','glow','ink'];

function vfxParticles(c,rng){
  const n=Math.max(1,Math.round(c.count)),p=[];
  for(let i=0;i<n;i++)p.push({
    x:rng(),y:rng(),p0:rng(),a0:rng()*Math.PI*2,
    cyc:Math.max(1,Math.round(c.speed*(1+Math.floor(rng()*2.4)))),
    wf:1+Math.floor(rng()*3),r:0.55+rng()*0.9,jit:rng()
  });
  return p;
}

// Clouds (silt, ink) accumulate density and then map density -> role, instead of
// stamping discs first-write-wins — which is what makes them read as layered volume
// rather than a pile of flat blobs.
function vfxCloud(c,parts,t,w,h,fq,wob,dark){
  const den=new Float32Array(w*h),s=c.seed>>>0;
  for(const p of parts){
    const u=((p.p0+t*p.cyc*fq)%1+1)%1;
    if(u>c.life)continue;
    const age=u/Math.max(0.01,c.life),amp=Math.pow(1-age,dark?1.15:0.8),k=Math.pow(u,0.55);
    let x,y,rr;
    if(dark){ // ink: a few puffs that bloom outward from the wound
      x=w/2+(p.x-0.5)*w*0.30*c.spread+Math.cos(p.a0)*k*w*0.20*c.spread+Math.sin(u*6.28*p.wf)*wob;
      y=h/2+(p.y-0.5)*h*0.26*c.spread+Math.sin(p.a0)*k*h*0.18*c.spread-u*h*0.16;
      rr=c.size*p.r*(0.9+k*2.6)*(0.55+c.spread);
    }else{  // silt: a ring of particles thrown out and drifting up
      x=w/2+Math.cos(p.a0)*k*c.spread*w*0.42+Math.sin(u*6.28*p.wf)*wob;
      y=h/2+Math.sin(p.a0)*k*c.spread*h*0.36-k*h*0.18;
      rr=c.size*p.r*(1.5+u*2.8);
    }
    const ri=Math.ceil(rr);
    for(let dy=-ri;dy<=ri;dy++)for(let dx=-ri;dx<=ri;dx++){
      const d=Math.hypot(dx,dy);if(d>rr)continue;
      const xx=Math.round(x+dx),yy=Math.round(y+dy);
      if(xx<0||xx>=w||yy<0||yy>=h)continue;
      const f=1-d/rr;den[yy*w+xx]+=amp*f*f;
    }
  }
  const m=newMat(w,h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const v=den[y*w+x]*(0.86+0.28*hash2(x,y,s+61));   // dithered edge
    if(v<0.07)continue;
    m[y][x]=dark?(v>0.95?BACK:v>0.52?SHADOW:v>0.22?HAZE2:HAZE)
                :(v>0.80?BELLY:v>0.34?HAZE2:HAZE);
  }
  return m;
}

function vfxFrame(c,clip,parts,t,w,h){
  const m=newMat(w,h),s=c.seed>>>0;
  const wob=(clip.amp||0)*0.9+0.4, fq=Math.max(0.25,clip.freq*3||1);
  const disc=(cx,cy,r,fn,only)=>stampDisc(m,w,h,cx,cy,r,fn,only);

  if(c.effect==='bubbles'){
    for(const p of parts){
      const u=((p.p0+t*p.cyc*fq)%1+1)%1;
      const rr=c.size*p.r*(u>0.9?Math.max(0,1-(u-0.9)/0.1):u<0.05?u/0.05:1);
      if(rr<0.6)continue;
      const x=p.x*w+Math.sin(u*Math.PI*2*p.wf+p.a0)*wob*c.spread*3;
      const y=h-1-u*(h-2);
      disc(x,y,rr,d=>d>0.60?BELLY:HAZE);
      if(rr>1.6)put(m,w,h,Math.round(x-rr*0.42),Math.round(y-rr*0.42),SPEC);
    }
  } else if(c.effect==='silt'){
    return vfxCloud(c,parts,t,w,h,fq,wob,false);
  } else if(c.effect==='godray'){
    const n=Math.max(2,Math.round(c.count/6)),lean=w*0.34;
    for(let i=0;i<n;i++){
      const base=(i+0.5)/n*w+Math.sin(t*Math.PI*2+i*1.7)*wob*2.2;
      const halfw=c.size*(1.6+c.spread*4);
      for(let y=0;y<h;y++){
        const cx=base+lean*(y/h),fall=1-y/h*0.82;
        for(let x=Math.floor(cx-halfw);x<=Math.ceil(cx+halfw);x++){
          const d=Math.abs(x-cx)/halfw;if(d>1)continue;
          const a=(1-d*d)*fall*(0.45+c.life*0.75);
          if(a>0.62)put(m,w,h,x,y,HAZE2,true);
          else if(hash2(x,y,s+i*97)<a*1.35)put(m,w,h,x,y,HAZE,true);
        }
      }
    }
  } else if(c.effect==='glow'){
    const pulse=0.78+0.22*Math.sin(t*Math.PI*2*Math.max(1,Math.round(fq)));
    const R=c.size*2.4*pulse;
    disc(w/2,h/2,R*2.5,d=>d>0.55?GLOWDIM:GLOW,true);
    disc(w/2,h/2,R,d=>d<0.42?SPEC:d<0.72?BELLY:GLOW);
    for(const p of parts){
      const ang=p.a0+t*Math.PI*2*p.cyc*(p.jit>0.5?1:-1);
      const rad=R*2.0+p.r*c.spread*w*0.24;
      put(m,w,h,Math.round(w/2+Math.cos(ang)*rad),Math.round(h/2+Math.sin(ang)*rad),GLOW,true);
    }
  } else { // ink / blood — a diffusing cloud
    return vfxCloud(c,parts,t,w,h,fq,wob,true);
  }
  return m;
}

function generateVfxFrames(c,rng,clip){
  const w=48,h=48,F=Math.max(1,clip.frames|0),parts=vfxParticles(c,rng),frames=[];
  for(let f=0;f<F;f++)frames.push(vfxFrame(c,clip,parts,f/F,w,h));
  return{w,h,frames,meta:{cx:w/2,cy:h/2,
    emitter:{effect:c.effect,count:Math.round(c.count),size:c.size,speed:c.speed,spread:c.spread,lifetime:c.life},
    anchors:{center:[w>>1,h>>1],source:[w>>1,c.effect==='bubbles'?h-1:h>>1]}}};
}

// ===================== MODULE: PROPS =====================
// Salvage is the point of the game (GDD §4), so props are wrecks, drums, gear and debris.
// Technique: a small modular kit shaded by one convex form model, then aged — corrosion
// eats the silhouette, and coral encrusts whatever faces the light. Everything reuses the
// shared stamping/dither/AO vocabulary, so props sit in the same world as the reef.
const PROP_KINDS=['crate','drum','tank','hull','debris'];
const PROP_RAMP=SHADES;

function generateProp(c,rng){
  const w=48,h=48,roles=newMat(w,h);
  const cx=w/2, cy=h/2;
  const bw=Math.max(6,c.width*w*0.42), bh=Math.max(6,c.height*h*0.42);
  const s=c.seed>>>0;

  // convex form: the surface normal of a rounded body at (u,v) is roughly (u,v)
  const lit=(u,v)=>u*LIGHT_X+v*LIGHT_Y;
  const shade=(u,v,x,y,bias)=>shadeRole(PROP_RAMP,clamp(0.58+lit(u,v)*0.36+(bias||0),0.14,0.99),x,y,0.7);

  const inShape=(x,y)=>{
    const u=(x-cx)/bw, v=(y-cy)/bh;
    switch(c.kind){
      case'crate':  return Math.abs(u)<=1&&Math.abs(v)<=1;
      case'drum':   return Math.abs(u)<=1&&Math.abs(v)<=1&&!(Math.abs(v)>0.86&&Math.abs(u)>0.82);
      case'tank':   return Math.abs(u)<=0.62&&Math.abs(v)<=1&&!(Math.abs(v)>0.80&&Math.abs(u)>0.44);
      case'hull':{  const d=Math.hypot(u*0.9,v*1.25); return d<=1&&d>=0.46&&v<0.55; }
      default:      return Math.hypot(u,v)<=1;
    }
  };
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    if(!inShape(x,y))continue;
    let u=(x-cx)/bw, v=(y-cy)/bh;
    if(c.kind==='drum'||c.kind==='tank')v*=0.25;          // cylinders shade across, not down
    roles[y][x]=shade(u,v,x,y);
  }

  // --- kit details -------------------------------------------------------------
  const band=(vv,role)=>{const y=Math.round(cy+vv*bh);
    for(let x=0;x<w;x++)if(roles[y]&&roles[y][x])roles[y][x]=role;};
  if(c.kind==='crate'){
    band(-0.55,SHADOW);band(0.55,SHADOW);band(-0.54,BACK);band(0.54,BACK);
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){                 // plank seams
      if(!roles[y][x])continue;
      if(((x-Math.round(cx-bw))%7)===0)roles[y][x]=SHADOW;}
  } else if(c.kind==='drum'){
    band(-0.52,BACK);band(-0.48,SHADOW);band(0.48,SHADOW);band(0.52,BACK);
  } else if(c.kind==='tank'){
    const vy=Math.round(cy-bh)-1;                            // valve + regulator stub
    for(let x=Math.round(cx-2);x<=Math.round(cx+2);x++)for(let y=vy-3;y<=vy;y++)put(roles,w,h,x,y,SHADOW);
    put(roles,w,h,Math.round(cx+3),vy-2,HIGH);put(roles,w,h,Math.round(cx+4),vy-2,HIGH);
    band(0.30,SHADOW);band(-0.30,SHADOW);
  } else if(c.kind==='hull'){
    for(let a=-1.3;a<=1.3;a+=0.16){                           // rivet line along the plate
      const rx=Math.round(cx+Math.sin(a)*bw*0.72), ry=Math.round(cy+Math.cos(a)*bh*0.72-bh*0.1);
      if(roles[ry]&&roles[ry][rx])roles[ry][rx]=hash2(rx,ry,s)>0.4?SPEC:HIGH;
    }
  } else {
    for(let y=0;y<h;y++)roles[y].fill(EMPTY);                 // debris = angular broken plate
    const n=3+Math.floor(rng()*3);
    for(let i=0;i<n;i++){
      const ox=(rng()-0.5)*bw*1.3, oy=(rng()-0.5)*bh*1.1;
      const rw=bh*(0.28+rng()*0.42), rh=bh*(0.16+rng()*0.34), ang=(rng()-0.5)*1.4;
      const ca=Math.cos(ang), sa=Math.sin(ang);
      for(let dy=-rh;dy<=rh;dy+=0.5)for(let dx=-rw;dx<=rw;dx+=0.5){
        const px=Math.round(cx+ox+dx*ca-dy*sa), py=Math.round(cy+oy+dx*sa+dy*ca);
        put(roles,w,h,px,py,shade(dx/rw,dy/rh,px,py));
      }
    }
  }

  // --- wear: corrosion eats the edges and blotches the plate --------------------
  if(c.wear>0.01){
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      if(!roles[y][x])continue;
      const n=fbm(x/5,y/5,s+77,3,0.55,0);
      const edge=!(roles[y][x-1]&&roles[y][x+1]&&roles[y-1]&&roles[y-1][x]&&roles[y+1]&&roles[y+1][x]);
      if(edge&&n<c.wear*0.42)roles[y][x]=EMPTY;              // bitten away
      else if(n<0.30+c.wear*0.22&&hash2(x,y,s+5)<c.wear)roles[y][x]=BACK;   // rust
    }
  }

  // --- encrustation: the reef grows on whatever faces the light ----------------
  if(c.encrust>0.01){
    for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
      if(!roles[y][x])continue;
      const open=!roles[y-1][x]||!roles[y][x-1];             // an upward/left-facing surface
      if(!open)continue;
      if(hash2(x,y,s+911)>c.encrust*0.55)continue;
      const r=0.7+hash2(x,y,s+13)*1.0;
      stampDisc(roles,w,h,x,y-1,r,(d,dx,dy,px,py)=>
        c.glow?(d<0.5?GLOW:GLOWDIM):shadeRole([S4,S5,S6,S7,S8],clamp(0.55+lit(dx,dy)*0.5,0,1),px,py,0.6));
    }
  }

  aoPass(roles,w,h,3,3);
  outlinePass(roles,w,h);
  return{w,h,roles,meta:{cx,cy,anchors:{base:[Math.round(cx),Math.round(cy+bh)],centre:[Math.round(cx),Math.round(cy)]}}};
}

// ===================== ANIMATION =====================
// Procedural motion models: pure (x,y,role,phase,meta,params) -> {dx,dy}, applied at
// bake time. No frames are ever drawn by hand.
const MOTIONS={
  swim:(x,y,role,ph,m,c)=>{const denom=Math.max(1,(m.headX||0)-(m.tailX||0));const rel=clamp(((m.headX||0)-x)/denom,0,1);return{dy:c.amp*Math.pow(rel,1.5)*Math.sin(x*c.freq-ph)};},
  // amplitude scales with height above the holdfast when the module supplies one:
  // the base stays planted and the tips travel. `bias` is a steady current.
  sway:(x,y,role,ph,m,c)=>{const k=m.baseY!=null?Math.pow(clamp((m.baseY-y)/Math.max(1,m.height),0,1),1.55):1;
    return{dx:(c.amp*Math.sin(ph-y*0.09)+c.bias*2.4)*k};},
  bob:(x,y,role,ph,m,c)=>({dy:c.amp*Math.sin(ph)+c.bias}),
  breathe:(x,y,role,ph,m,c)=>{const k=c.amp*0.05*Math.sin(ph);return{dx:(x-m.cx)*k,dy:(y-m.cy)*k};},
  flutter:(x,y,role,ph,m,c)=>role===FIN?{dy:c.amp*Math.sin(x*0.8-ph*2)}:{},
  none:()=>({}),
  baked:()=>({})
};
const MOTION_LABEL={none:'static',baked:'baked'};

const SCRATCH=document.createElement('canvas').getContext('2d',{willReadFrequently:true});
function matToCanvas(roles,w,h,cache){
  const img=SCRATCH.createImageData(w,h),d=img.data;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const r=roles[y][x];if(!r)continue;const col=cache[r];if(!col)continue;
    const i=(y*w+x)*4;d[i]=col[0];d[i+1]=col[1];d[i+2]=col[2];d[i+3]=col[3];}
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').putImageData(img,0,0);return cv;
}
function buildAsset(m,c,cl){const rng=mulberry32((c.seed>>>0)||1);return m.baked?m.generateFrames(c,rng,cl):m.generate(c,rng);}
function bakeFrames(asset,cache,cl){
  const w=asset.w,h=asset.h;
  if(asset.frames)return asset.frames.map(r=>matToCanvas(r,w,h,cache));  // pre-baked module
  const F=Math.max(1,cl.frames|0),model=MOTIONS[cl.motion]||MOTIONS.none,out=[];
  const cp={amp:cl.amp,freq:cl.freq,bias:cl.bias||0},roles=asset.roles,meta=asset.meta;
  for(let f=0;f<F;f++){
    const ph=2*Math.PI*f/F,img=SCRATCH.createImageData(w,h),d=img.data;
    for(let x=0;x<w;x++)for(let y=0;y<h;y++){const role=roles[y][x];if(!role)continue;
      const disp=model(x,y,role,ph,meta,cp),tx=x+Math.round(disp.dx||0),ty=y+Math.round(disp.dy||0);
      if(tx<0||tx>=w||ty<0||ty>=h)continue;const col=cache[role];if(!col)continue;
      const i=(ty*w+tx)*4;d[i]=col[0];d[i+1]=col[1];d[i+2]=col[2];d[i+3]=col[3];}
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').putImageData(img,0,0);out.push(cv);
  }
  return out;
}
// one asset -> one thumbnail, used by the library without touching live state
function thumbOf(entry,px){
  const m=modById(entry.module),cl=entry.clips[0];
  const asset=buildAsset(m,entry.cfg,cl),cache=buildColorCache(entry.cfg.pal,entry.cfg.depth,entry.cfg.corrupt);
  const fr=bakeFrames(asset,cache,cl)[0];
  const cv=document.createElement('canvas'),s=Math.max(1,Math.floor(px/Math.max(asset.w,asset.h)));
  cv.width=asset.w*s;cv.height=asset.h*s;const x=cv.getContext('2d');x.imageSmoothingEnabled=false;
  x.drawImage(fr,0,0,cv.width,cv.height);return cv;
}

const tank=document.getElementById('tank'),tctx=tank.getContext('2d');
const DPR=Math.max(1,Math.min(2,window.devicePixelRatio||1));

MODULES.forEach((m,i)=>{
  state.cfgs[m.id]=Object.assign(m.defaults(),{seed:1234+i*7717});
  state.clipsets[m.id]=m.clips();
  state.clipIdxs[m.id]=0;
});
const mod=()=>modById(state.modId);
const cfg=()=>state.cfgs[state.modId];
